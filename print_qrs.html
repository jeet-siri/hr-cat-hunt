<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print QR Codes - HR Cat Hunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f5;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px dashed #e4e4e7;
        }
        .card img {
            width: 200px;
            height: 200px;
            margin: 15px 0;
        }
        .cat-id {
            font-size: 24px;
            font-weight: 700;
            color: #ff8a00;
            margin-bottom: 5px;
        }
        .cat-name {
            font-size: 18px;
            color: #3f3f46;
        }
        @media print {
            body { background: #fff; }
            .card { box-shadow: none; break-inside: avoid; margin-bottom: 20px; }
            .grid { gap: 10px; }
            .no-print { display: none; }
        }
        .print-btn {
            display: block;
            margin: 0 auto 30px auto;
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
